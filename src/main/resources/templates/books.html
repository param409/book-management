<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Book List</title></head>
<body>
    <h1>Book Management</h1>
    <a th:href="@{/books/add}">Add Book</a>
    <table border="1" cellpadding="8">
        <tr><th>ID</th><th>Title</th><th>Author</th><th>Price (₹)</th><th>Action</th></tr>
        <tr th:each="b : ${books}">
            <td th:text="${b.id}"></td>
            <td th:text="${b.title}"></td>
            <td th:text="${b.author}"></td>
            <td th:text="${b.price}"></td>
            <td><a th:href="@{/books/delete/{id}(id=${b.id})}">Delete</a></td>
        </tr>
    </table>
    <p th:if="${#lists.isEmpty(books)}">No books available.</p>
</body>
</html>
